[package]
name = "xenolith-lang-python"
description = "Python support for xenolith: the python guest, its triviality rule and ruff defaults"
keywords = ["xenolith", "python", "ruff", "lint"]
categories = ["development-tools"]
documentation = "https://docs.rs/xenolith-lang-python"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

# `languages/api:V32`: the api contract, the parser runtime and the
# grammar. Same tree-sitter as the shell crate's, so the workspace carries
# one copy of it.
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.2.0" }
tree-sitter = "0.27"
tree-sitter-python = "0.25"

[lints]
workspace = true
