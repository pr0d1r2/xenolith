[package]
name = "xenolith-lang-xml"
description = "XML support for xenolith: text plists whose launchd ProgramArguments hold shell"
keywords = ["xenolith", "xml", "plist", "launchd", "lint"]
categories = ["development-tools"]
documentation = "https://docs.rs/xenolith-lang-xml"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The closed form (`nix:V112`): what ships is named, so a file added beside
# the crate stays out of the package until it is listed here.
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

# Three dependencies, the most `languages/api:V32` allows a language
# crate: the api contract, its own grammar, and the grammar's runtime. The
# guest is NAMED as `LangId::Shell` and never linked (`languages:C24`).
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.1.0" }
# The parser runtime. Same version as the shell crate's, so the workspace
# carries one copy of it.
tree-sitter = "0.27"
# tree-sitter-xml 0.7.0, published by tree-sitter-grammars (MIT) on
# crates.io (`languages/data/xml:R187`), so a crate dependency rather than
# vendored C (`languages:V121`). An element's text, its entity references
# and its CDATA sections are grammar nodes, never a regex over bytes
# (`languages:C4`).
tree-sitter-xml = "0.7"

[lints]
workspace = true
