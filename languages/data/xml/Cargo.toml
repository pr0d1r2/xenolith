[package]
name = "xenolith-lang-xml"
description = "XML support for xenolith: text plists whose launchd ProgramArguments hold shell"
keywords = ["xenolith", "xml", "plist", "launchd", "lint"]
categories = ["development-tools"]
documentation = "https://docs.rs/xenolith-lang-xml"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The closed form (`nix:V112`): what ships is named, so a file added beside
# the crate stays out of the package until it is listed here.
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

# Two dependencies (`languages/api:V32`): the api contract and the XML
# reader. The guest is NAMED as `LangId::Shell` and never linked
# (`languages:C24`).
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.2.0" }
# quick-xml (MIT), pure Rust, its only default dependency `memchr`: a
# streaming reader whose events carry raw bytes and positions, so element
# text, entity references and CDATA sections are events, never a regex
# over bytes (`languages:C4`).
quick-xml = "0.42"

[lints]
workspace = true
