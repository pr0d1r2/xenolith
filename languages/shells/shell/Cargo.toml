[package]
name = "xenolith-lang-shell"
description = "Shell support for xenolith: the single-command classifier, bash host sinks, shell guest defaults"
keywords = ["xenolith", "shell", "bash", "shellcheck", "lint"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Three dependencies, the maximum `languages/api:V32` allows a language
# crate: the api contract, its own grammar, and the grammar's runtime. No
# root crate and no other language crate -- the dependency arrow points
# one way, and `scripts/guard:T47` checks it from cargo metadata rather
# than trusting review.
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.1.0" }
# tree-sitter-bash, not a regex. `languages/shells/shell:V3` says the
# classification comes from the AST: `echo "a | b"` contains a pipe
# character and is a single simple command, while `a|b` is two commands,
# and no amount of substring matching tells those apart. The grammar also
# resolves heredoc terminators and quoting, which is the other half of the
# same argument (`languages/api/src/site:V38`).
tree-sitter = "0.27"
tree-sitter-bash = "0.25"

[lints]
workspace = true
