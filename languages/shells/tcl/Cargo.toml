[package]
name = "xenolith-lang-tcl"
description = "Tcl and expect support for xenolith: exec and spawn sinks, on the vendored tree-sitter-tcl grammar"
keywords = ["xenolith", "tcl", "expect", "lint"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The vendored C ships in the package, or `cargo test` from crates.io has
# no grammar to build (`languages:V121`, `tests:V14`).
include = ["Cargo.toml", "build.rs", "src/**", "tests/**", "vendor/**"]

# `languages/api:V32`: the api contract and the grammar's runtime. The
# grammar itself is not a dependency at all -- `tree-sitter-tcl` is not on
# crates.io (`languages/shells/tcl:R194`), so its generated C is VENDORED
# under `vendor/tree-sitter-tcl` and compiled by `build.rs`
# (`languages:V121`), never pulled as a git dependency, which could not be
# published.
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.1.0" }
# The parser runtime the vendored C plugs into. Same version as the shell
# and pkl crates', so the workspace carries one copy of it.
tree-sitter = "0.27"

# The tcl check (`languages/shells/tcl:V198`): Tcl's `info complete` in
# Rust, so a host file is checked with no `tclsh` on PATH. A bin because
# the lint engine runs checks as commands (`src/lint:V8`); `main.rs` is a
# shim over `syntax::run`.
[[bin]]
name = "xenolith-tcl-syntax"
path = "src/main.rs"

[build-dependencies]
# Compiles the vendored `parser.c` and `scanner.c`. Already in the lock
# through tree-sitter's own build, so this adds a use, not a crate.
cc = "1"

# NOT `lints.workspace = true`, for the reason the pkl crate gives: the
# workspace FORBIDS `unsafe_code`, a vendored grammar is reached through
# FFI (`languages:V121`), and `forbid` cannot be lifted locally. So this
# crate restates the workspace table with `unsafe_code = "deny"`, and
# exactly one module (`src/grammar.rs`) allows it. Everything else is the
# workspace table verbatim; keep the two in step.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
