[package]
name = "xenolith-lang-tcl"
description = "Tcl and expect support for xenolith: exec and spawn sinks, on a pure-Rust Tcl word parser"
keywords = ["xenolith", "tcl", "expect", "lint"]
categories = ["development-tools"]
documentation = "https://docs.rs/xenolith-lang-tcl"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

# `languages/api:V32`: the api contract, and nothing else. The parser is
# this crate's own (`src/script.rs`, on `src/syntax.rs`): no grammar, no
# generated C, no FFI.
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.1.0" }

# The tcl check (`languages/shells/tcl:V198`): Tcl's `info complete` in
# Rust, so a host file is checked with no `tclsh` on PATH. A bin because
# the lint engine runs checks as commands (`src/lint:V8`); `main.rs` is a
# shim over `syntax::run`.
[[bin]]
name = "xenolith-tcl-syntax"
path = "src/main.rs"

[lints]
workspace = true
