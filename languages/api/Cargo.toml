[package]
name = "xenolith-lang-api"
description = "The contract every xenolith language crate implements: Host and Guest traits, LangId, shared types"
keywords = ["xenolith", "lint", "refactor", "static-analysis"]
categories = ["development-tools"]
documentation = "https://docs.rs/xenolith-lang-api"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The closed form (`nix:V112`): what ships is named, so a file added beside
# the crate stays out of the package until it is listed here.
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

# ONE dependency, checked rather than reviewed (`languages/api:V32`).
# `xenolith-shebang` is re-exported as `api::shebang` so a language crate
# reaches those functions through the crate it already depends on -- a
# second direct dependency in every language crate would be a second thing
# the dependency guard has to allow, for no gain.
#
# No grammar crate here, ever: it would land in every language crate's tree
# whether or not that crate parses the language, and the feature split
# (`nix:C8`) exists precisely so a consumer compiles only the grammars they
# use.
#
# `version` alongside `path` because both are needed to publish: cargo uses
# the path locally and rewrites to the registry version in the published
# manifest (`src:C1`, lockstep versions).
[dependencies]
xenolith-shebang = { path = "../shebang", version = "0.1.0" }

# NO FEATURES, deliberately (`languages/api:V33`). `LangId` names every
# known language regardless of which crates a build compiles in, so a host
# can report "this site holds shell and shell is not compiled in" instead of
# failing to name what it found.
[features]

[lints]
workspace = true
