[package]
name = "xenolith-lang-pkl"
description = "Pkl support for xenolith: hk step sinks holding shell, read with pklr in pure Rust"
keywords = ["xenolith", "pkl", "hk", "lint"]
categories = ["development-tools"]
documentation = "https://docs.rs/xenolith-lang-pkl"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

# `languages/api:V32`: the api contract and the parser. `pklr` is Pkl in
# pure Rust; without its default features it is the lexer and parser
# alone (no evaluator, no network, no zip), and it pulls only `libm` and
# `thiserror`. Pinned exactly: its API moves between majors often, and a
# bump is its own commit.
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.1.0" }
pklr = { version = "=5.2.1", default-features = false }

[lints]
workspace = true
