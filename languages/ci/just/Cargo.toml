[package]
name = "xenolith-lang-just"
description = "just support for xenolith: recipe bodies holding shell, on a pure-Rust justfile parser"
keywords = ["xenolith", "just", "justfile", "lint"]
categories = ["development-tools"]
documentation = "https://docs.rs/xenolith-lang-just"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

# `languages/api:V32`: the api contract, and nothing else. The parser is
# this crate's own (`src/lexer.rs`, `src/parse.rs`): no grammar, no
# generated C, no FFI.
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.2.0" }

[lints]
workspace = true
