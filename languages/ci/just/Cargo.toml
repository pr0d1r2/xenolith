[package]
name = "xenolith-lang-just"
description = "just support for xenolith: recipe bodies holding shell, on a vendored grammar"
keywords = ["xenolith", "just", "justfile", "lint"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The vendored C ships in the package, or `cargo test` from crates.io has
# no grammar to build (`languages:V121`, `tests:V14`).
include = ["Cargo.toml", "build.rs", "src/**", "tests/**", "vendor/**"]

# `languages/api:V32`: the api contract and the grammar's runtime. The
# grammar is not a dependency: `tree-sitter-just` 0.2.0 IS on crates.io,
# but it pins tree-sitter ~0.25 and both runtimes declare
# `links = "tree-sitter"`, so cargo cannot put it beside the workspace's
# 0.27. Its generated C is VENDORED under `vendor/tree-sitter-just`
# instead and compiled by `build.rs` (`languages:V121`), the record in
# `vendor/tree-sitter-just/UPSTREAM`.
[dependencies]
xenolith-lang-api = { path = "../../api", version = "0.1.0" }
# The parser runtime the vendored C plugs into. Same version as the shell
# and pkl crates', so the workspace carries one copy of it.
tree-sitter = "0.27"

[build-dependencies]
# Compiles the vendored `parser.c` and `scanner.c`. Already in the lock
# through tree-sitter's own build, so this adds a use, not a crate.
cc = "1"

# NOT `lints.workspace = true`, for the reason the pkl crate gives: the
# workspace FORBIDS `unsafe_code`, a vendored grammar is a C function
# reached through FFI (`languages:V121`), and `forbid` cannot be lifted
# locally. So this restates the workspace table with `unsafe_code =
# "deny"`, and exactly one module (`src/grammar.rs`) allows it. Keep the
# rest in step with the workspace table.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
