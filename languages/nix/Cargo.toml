[package]
name = "xenolith-lang-nix"
description = "Nix support for xenolith: rnix-based host sinks that hold shell"
keywords = ["xenolith", "nix", "shell", "lint", "refactor"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Two dependencies, inside what `languages/api:V32` allows a language
# crate: the api contract and its own grammar. No root crate and no other
# language crate -- nix NAMES its guest as `LangId::Shell` and never links
# the shell crate (`languages:C24`).
[dependencies]
xenolith-lang-api = { path = "../api", version = "0.1.0" }
# rnix, not tree-sitter-nix and not a regex (`languages:C4`). It is a
# lossless rowan tree, so every byte of the host -- whitespace, comments,
# the `''` of an indented string -- is a token with a range, and a site's
# delimiter spans come straight off grammar nodes
# (`languages/api/src/site:V38`). rowan itself arrives through rnix and is
# not named here: the node methods used are reachable through rnix's own
# `SyntaxNode` alias, and a second direct dependency would be a second
# version to keep in step.
rnix = "0.14"

[lints]
workspace = true
