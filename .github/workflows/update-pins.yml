# Keep this checkout converged with the fleet pin provider.  The autonomous
# loop declines ordinary work while the lock is behind that provider, so this
# maintenance job must remain independent of the loop's issue lane.
name: update pins

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-pins
  cancel-in-progress: true

jobs:
  update:
    name: refresh and propose pin update
    runs-on: ubuntu-latest
    permissions:
      # The job pushes its generated branch and opens the corresponding PR.
      contents: write # limited to the generated branch
      pull-requests: write # limited to the generated update PR
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: refresh flake lock
        run: nix flake update

      - name: open update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          branch="automation/update-pins"
          git switch -C "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(nix): refresh flake pins"
          git push --force-with-lease --set-upstream origin "$branch"
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --head "$branch" --base main \
              --title "chore(nix): refresh flake pins" \
              --body "Refresh the committed Nix lock to the fleet pin provider.\n\nWhy: nix:C6 and nix:V17."
          fi
