# Formatting is not a matter of taste here: it is the difference between a
# diff that shows a change and a diff that shows a re-wrap. Defaults
# everywhere except the two settings that make `cargo fmt` deterministic
# across the comments this codebase leans on.
edition = "2024"
# Nothing else. `wrap_comments` and `comment_width` would fit this
# codebase -- the reasoning lives in comments here -- but both are
# nightly-only, and rustfmt merely WARNS about an unstable key rather
# than failing, so setting them would mean a formatting rule that
# silently does not apply.
