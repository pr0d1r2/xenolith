# The release, configured rather than scripted (`nix:V109`).
#
# The runner is `cargo-release`, as in every published sibling (sherd,
# microlith, itok): it already does the whole list -- clean tree, allowed
# branch, tag scheme, dry-run first, verify, publish in dependency order,
# push. A release script here would be a second implementation of one rule
# set, and it would not stop being one because we wrote it.
#
# HOW IT IS RUN. Dry-run is `cargo-release`'s DEFAULT, and it reports every
# problem in one pass rather than the first one it hits:
#
#     cargo release minor --workspace     # verify everything, change nothing
#
# `--workspace` IS NOT OPTIONAL. The root manifest is also a package, so a
# command without it selects `xenolith` alone: `publish` then refuses,
# because the crates it depends on were never selected (`nix:B4`). `tag` is
# the exception -- one `v<x.y.z>` tag marks the lockstep version, and the
# root package alone creates it.
#
# THE BUMP DOES NOT HAPPEN HERE. cargo-release's default flow bumps the
# version, COMMITS it and pushes that commit to the release branch; `main`
# takes changes through pull requests only. So the version is bumped in a PR
# like any other change -- the edit without the commit, then the CHANGELOG
# by hand (`nix:V110`):
#
#     cargo release version minor --workspace --execute
#
# and only the TAIL runs from `main` once it merges:
#
#     cargo release hook                  # the gate; dry-run is enough
#     cargo release tag --execute
#     cargo release publish --workspace --execute
#     cargo release push --workspace --execute
#
# A NEW CRATE NAME is rate-limited by crates.io: a burst of 5, then about
# one every 10 minutes. cargo-release refuses up front rather than waiting
# ("attempting to publish N new crates which is above the rate limit"), so
# a release that adds more than that publishes in `-p` batches, dependencies
# first, and pushes the tag only after the last one. 0.1.0 went out as 5
# then 4. New versions of existing crates are not affected.
#
# `hook` IS FIRST ON PURPOSE, and it is the one thing here that must not be
# assumed: `tag`, `publish` and `push` do NOT run `pre-release-hook` -- only
# the full flow does, and `cargo release hook` on its own. On a repo that
# bumps in a PR, a sequence starting at `tag` publishes whatever the tree
# happens to hold. Running it dry is enough: the hook executes, and a
# non-zero return aborts.
#
# `docs/INTEGRATION.md` carries this runbook too, beside the gate it calls.

# The branch a release may happen from. The `.crate` records the commit it
# was built from (`.cargo_vcs_info.json`), and a squash merge ORPHANS the
# branch sha -- so publishing off a PR branch leaves the artifact naming a
# commit that is on no branch.
allow-branch = ["main"]

# THE GATE, called rather than re-checked. A non-zero return ABORTS the
# release, which makes the gate a PRECONDITION of publishing rather than
# something the releaser is trusted to have run. `--check` because the fix
# commands would rewrite a tree cargo-release has just asserted is clean;
# `--no-fail-fast` because a release is the one moment where a complete list
# beats an early one.
pre-release-hook = ["hk", "check", "--all", "--check", "--no-fail-fast"]

# LOCKSTEP (`src:C1`): every crate of the workspace carries the one
# `[workspace.package] version`, so a bump moves them together and one commit
# records it. cargo-release publishes in DEPENDENCY order, read from the
# graph rather than listed here: `xenolith-shebang`, then `xenolith-lang-api`,
# then the language crates, then `xenolith` -- a crate reaches crates.io only
# after everything it depends on already has.
shared-version = true
consolidate-commits = true

# `v<x.y.z>`, one tag for the lockstep version: the `semver` gate step the
# siblings run (`nix:T110` here) diffs the pub API against the last `v*` tag,
# and a per-crate tag scheme would leave it no baseline to find.
tag-name = "v{{version}}"

# `verify` builds each packaged tarball before upload. It is the default; it
# is written down because it is the check that catches a `.crate` which
# cannot compile from what it actually ships, and a default nobody wrote down
# is a default somebody eventually turns off. It only COMPILES the tarball:
# running each crate's own suite from its `.crate` is `nix:T112`.
publish = true
verify = true

# `xenolith-dev` is never released: `publish = false` in its manifest keeps it
# off crates.io, and `[package.metadata.release] release = false` there keeps
# cargo-release from tagging or bumping it as a crate of its own (`nix:V349`).
