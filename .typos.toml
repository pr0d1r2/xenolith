# `typos` config. Every entry below is an exemption, not a suppression: each
# names something deliberately spelled the way it is.

[files]
# `pkl/` is upstream's hk schema, vendored so the gate runs with no network
# (`.:C3`). "Fixing" a typo in it would fork it from the pinned release
# while still claiming to be verbatim.
extend-exclude = ["pkl/"]

[default.extend-words]
# The project name and its geological source. A xenolith is a foreign rock
# fragment enclosed in host rock; `xnl` is the binary.
xenolith = "xenolith"
xnl = "xnl"
